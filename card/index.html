<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adeline Tang — Director, Hinode East Enterprise</title>

<meta property="og:type" content="profile">
<meta property="og:title" content="Adeline Tang — Director, Hinode East Enterprise">

<meta property="og:url" content="https://hinodeeast.com/card/">

<style>
  :root{
    --cream:#F5F0E8;
    --cream-deep:#EDE6DA;
    --gold:#B8922A;
    --gold-soft:rgba(184,146,42,.28);
    --charcoal:#1A1A1A;
    --charcoal-60:rgba(26,26,26,.60);
    --charcoal-40:rgba(26,26,26,.40);
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html{-webkit-text-size-adjust:100%}

  body{
    background:var(--cream);
    color:var(--charcoal);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:44px 22px calc(40px + env(safe-area-inset-bottom));
  }

  .card{width:100%;max-width:400px;text-align:center}

  /* ---- rising sun mark: the signature ---- */
  .mark{width:140px;height:78px;margin:0 auto 30px;display:block;overflow:visible}
  .mark .sun{
    transform-origin:66px 62px;
    animation:rise 1.15s cubic-bezier(.22,.9,.3,1) both;
  }
  .mark .ray{animation:fade .7s ease-out both}
  .mark .ray:nth-of-type(2){animation-delay:.62s}
  .mark .ray:nth-of-type(3){animation-delay:.74s}
  .mark .ray:nth-of-type(4){animation-delay:.86s}

  @keyframes rise{
    from{transform:translateY(26px) scaleY(.45);opacity:0}
    to{transform:none;opacity:1}
  }
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:.9;transform:none}}

  /* ---- identity ---- */
  .name{
    font-family:Georgia,"Times New Roman",serif;
    font-size:38px;
    line-height:1.12;
    letter-spacing:-.015em;
    font-weight:700;
  }
  .role{
    margin-top:11px;
    font-size:13px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:600;
  }
  .org{
    margin-top:7px;
    font-family:Georgia,"Times New Roman",serif;
    font-size:17px;
    letter-spacing:.06em;
    color:var(--charcoal-60);
  }
  .tagline{
    margin-top:20px;
    font-family:Georgia,"Times New Roman",serif;
    font-style:italic;
    font-size:16px;
    color:var(--charcoal-60);
  }

  .rule{
    width:52px;height:1px;
    background:var(--gold);
    margin:28px auto;
    opacity:.6;
  }

  /* ---- actions ---- */
  .save{
    display:flex;align-items:center;justify-content:center;gap:9px;
    width:100%;
    padding:18px;
    background:var(--charcoal);
    color:var(--cream);
    text-decoration:none;
    font-size:15px;
    font-weight:600;
    letter-spacing:.09em;
    text-transform:uppercase;
    border:1px solid var(--charcoal);
    transition:background .18s ease,color .18s ease;
  }
  .save:hover,.save:focus-visible{background:var(--gold);border-color:var(--gold);color:#fff}

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:10px;
  }
  .act{
    display:flex;flex-direction:column;align-items:center;gap:7px;
    padding:17px 8px;
    background:var(--cream-deep);
    border:1px solid var(--gold-soft);
    color:var(--charcoal);
    text-decoration:none;
    transition:border-color .18s ease,background .18s ease;
  }
  .act:hover,.act:focus-visible{border-color:var(--gold);background:#fff}
  .act svg{width:21px;height:21px;stroke:var(--gold);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .act span{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--charcoal-60);font-weight:600}
  .act.wide{grid-column:1 / -1;flex-direction:row;gap:11px;padding:15px}

  a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

  /* ---- services ---- */
  .services{
    margin-top:34px;
    font-size:11px;
    letter-spacing:.15em;
    text-transform:uppercase;
    color:var(--charcoal-40);
    line-height:2.1;
  }
  .services b{color:var(--gold);font-weight:400;margin:0 5px}

  .foot{
    margin-top:30px;
    padding-top:22px;
    border-top:1px solid var(--gold-soft);
    font-size:11px;
    letter-spacing:.06em;
    color:var(--charcoal-40);
    line-height:1.9;
  }

  @media (prefers-reduced-motion:reduce){
    .mark .sun,.mark .ray{animation:none;opacity:1;transform:none}
  }
</style>
</head>
<body>

    <line class="ray" x1="8"  y1="70" x2="124" y2="70" stroke="#B8922A" stroke-width="2.6" stroke-linecap="round"/>
